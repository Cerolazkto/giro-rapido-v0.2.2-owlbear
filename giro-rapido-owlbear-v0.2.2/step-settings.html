<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Giro Rápido · Passo</title>
  <style>
    :root{color-scheme:dark;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{background:#1d2634;color:#ecf2f9;margin:0;padding:15px 16px}
    h1{font-size:14px;font-weight:700;margin:0 0 11px;letter-spacing:.01em}
    label{display:block;font-size:12px;color:#b9c6d8;margin-bottom:5px}
    .controls{display:flex;align-items:center;gap:7px}
    input{width:100%;min-width:0;padding:9px;border:1px solid #586779;border-radius:7px;background:#111b28;color:#fff;text-align:center;font:600 20px system-ui;font-variant-numeric:tabular-nums}
    button{border:1px solid #546479;border-radius:7px;background:#29384a;color:#fff;cursor:pointer;min-height:34px;transition:background .12s}
    button:hover{background:#41536b}button:focus-visible,input:focus-visible{outline:2px solid #b6f6e9;outline-offset:1px}
    button:disabled{opacity:.45;cursor:default}
    .adjust{flex:none;width:37px;height:41px;font-size:21px;line-height:1}
    .degree{font-weight:600;font-size:17px;color:#d4dfe9}
    .quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:11px}
    .quick button{font-size:11px;min-height:32px;padding:2px}
    .quick button[aria-pressed=true]{border-color:#b5eadf;background:#294b4e}
    .foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;gap:5px}
    .hint{color:#a7b5c9;font-size:11px}
    #status{color:#a7ddc9;font-size:11px;white-space:nowrap}
  </style>
</head>
<body>
  <main>
    <h1>Passo de rotação</h1>
    <label for="angle">Graus por movimento da rodinha</label>
    <div class="controls">
      <button type="button" class="adjust" id="less" aria-label="Diminuir um grau">−</button>
      <input id="angle" type="text" inputmode="decimal" autocomplete="off" aria-label="Passo de rotação em graus" value="15" />
      <span class="degree">°</span>
      <button type="button" class="adjust" id="more" aria-label="Aumentar um grau">+</button>
    </div>
    <div class="quick" aria-label="Valores rápidos">
      <button type="button" data-step="5">5°</button>
      <button type="button" data-step="10">10°</button>
      <button type="button" data-step="15">15°</button>
      <button type="button" data-step="30">30°</button>
      <button type="button" data-step="45">45°</button>
      <button type="button" data-step="90">90°</button>
    </div>
    <div class="foot"><span class="hint">0,1° a 360° · pessoal</span><span id="status" role="status">Carregando…</span></div>
  </main>
  <script type="module" src="/src/step-panel.js"></script>
</body>
</html>
